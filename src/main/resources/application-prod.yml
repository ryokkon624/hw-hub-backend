spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    host: ${SES_SMTP_HOST}  # 例: email-smtp.ap-northeast-1.amazonaws.com
    port: 587
    username: ${SES_SMTP_USER}
    password: ${SES_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
logging:
  level:
    "[com.hwhub.backend]": INFO
    "[org.mybatis]": WARN
    "[org.springframework.security]": INFO

hwhub:
  jwt:
    secret: ${HWHUB_JWT_SECRET}

  object-storage:
    bucket: ${HWHUB_OBJECT_STORAGE_BUCKET}

  aws:
    s3:
      region: ap-northeast-1
      # endpoint は指定しない（AWS S3を使う）
      path-style-access-enabled: false

  cors:
    allowed-origins:
      - "https://stg.familyapp-hwhub.com"

  auth:
    email-verification:
      enabled: true
      send-mail: true
      token-ttl-minutes: 30
      resend-cooldown-seconds: 60
      max-requests-per-day: 5
      front-base-url: https://familyapp-hwhub.com
      verify-path: /email-verify
    password-reset:
      enabled: true
      send-mail: true
      token-ttl-minutes: 30
      resend-cooldown-seconds: 60
      max-requests-per-day: 5
      front-base-url: https://familyapp-hwhub.com
      reset-path: /password/reset

  mail:
    from: no-reply@familyapp-hwhub.com
