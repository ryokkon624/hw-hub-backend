spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/hwhub_db?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: hwhub
    password: hwhub
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hwhub.backend.infrastructure.mybatis.generated.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.hwhub.backend: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: DEBUG

hwhub:
  jwt:
    secret: "change-this-to-long-random-secret"  # 本番環境では環境変数から読むのが理想
    expiry-millis: 14400000  # 4時間 = 4 * 60 * 60 * 1000
