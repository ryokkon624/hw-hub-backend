spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hwhub_db?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: hwhub
    password: hwhub

logging:
  level:
    com.hwhub.backend: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: DEBUG

hwhub:
  jwt:
    secret: "change-this-to-long-random-secret"

  object-storage:
    bucket: hwhub-dev-file

  aws:
    s3:
      region: ap-northeast-1
      endpoint: http://localhost:4566
      access-key: dummy
      secret-key: dummy
      path-style-access-enabled: true

  cors:
    allowed-origins:
      - "http://localhost:5173"