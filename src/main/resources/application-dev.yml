spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hwhub_db?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Tokyo
    username: hwhub
    password: hwhub
  mail:
    host: localhost
    port: 1025
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  config:
    import: optional:file:.env[.properties]
logging:
  level:
    "[com.hwhub.backend]": DEBUG
    "[org.mybatis]": DEBUG
    "[org.springframework.security]": DEBUG

hwhub:
  jwt:
    secret: "change-this-to-long-random-secret"

  object-storage:
    bucket: hwhub-dev-file

  aws:
    s3:
      region: ap-northeast-1
      endpoint: http://localhost:4566
      access-key: dummy
      secret-key: dummy
      path-style-access-enabled: true

  cors:
    allowed-origins:
      - "http://localhost:5173"

  auth:
    email-verification:
      enabled: true
      send-mail: true
      token-ttl-minutes: 30
      resend-cooldown-seconds: 60
      max-requests-per-day: 5
      front-base-url: http://localhost:5173
      verify-path: /email-verify
    password-reset:
      enabled: true
      send-mail: true
      token-ttl-minutes: 30
      resend-cooldown-seconds: 60
      max-requests-per-day: 5
      front-base-url: http://localhost:5173
      reset-path: /password/reset
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # Google Cloud 側に登録する redirect URI と完全一致させる
      redirect-uri: http://localhost:8080/oauth/google/callback
      # フロント（302の戻し先の土台）
      front-base-url: http://localhost:5173
      # 成功/失敗時に、front-base-url + path にリダイレクトする
      success-redirect-path: /login
      failure-redirect-path: /login
      # Google側に要求するスコープ（基本はこれでOK）
      scope: "openid email profile"
      state-ttl-seconds: 300
      # state署名用のシークレット（HMAC）。十分長いランダム文字列を Secrets Manager 等に置く
      oauth-state-secret: ${HWHUB_OAUTH_STATE_SECRET}
      # （任意）Cookie名を変えたい場合
      state-cookie-name: hwhub_google_oauth_state
      # CookieのSecure属性（開発時はfalse、本番時はtrue推奨）
      state-cookie-secure: false
      # 連携成功時のリダイレクト先パス
      google-link-success-redirect-path: /settings/account
      # 連携失敗時のリダイレクト先パス
      google-link-failure-redirect-path: /settings/account
  deep-link:
    # iOS: Apple Developer Portal の Team ID + Bundle ID
    ios-app-id: "TEAMID_PLACEHOLDER.com.hwhub.app"
    android-package-name: "com.hwhub.app"
    # Android: keytool -list -v でフィンガープリントを確認
    android-sha256-cert-fingerprint: "SHA256_PLACEHOLDER"

  mail:
    from: no-reply@local.familyapp-hwhub.com
