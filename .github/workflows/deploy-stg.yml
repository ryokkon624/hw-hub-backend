name: deploy-backend-stg

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "564323392873"
  ECS_CLUSTER: hwhub-stg-ephem
  ECS_SERVICE: hwhub-backend-stg-ephem
  TASK_FAMILY: hwhub-backend-ephem
  CONTAINER_NAME: hwhub-backend
  ECR_REPOSITORY: hwhub-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe がタグ履歴を参照するため fetch-depth: 0 が必須
          fetch-depth: 0

      - name: Resolve STG version (git describe)
        id: version
        run: |
          # タグが1件もない場合のフォールバック
          RAW=$(git describe --tags --long 2>/dev/null || echo "v0.0.0-0-g${GITHUB_SHA:0:7}")
          # v1.0.0-3-gabcdef1  →  v1.0.0-stg.3 に変換
          # フォーマット: <tag>-<distance>-g<hash>
          TAG=$(echo "$RAW" | sed 's/-[0-9]*-g[0-9a-f]*$//')
          DISTANCE=$(echo "$RAW" | grep -oP '(?<=-)\d+(?=-g)')
          APP_VERSION="${TAG}-stg.${DISTANCE}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved STG version: ${APP_VERSION}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::564323392873:role/gh-actions-hwhub-backend-stg
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        id: build
        run: |
          IMAGE_URI_SHA="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:stg-${GITHUB_SHA}"
          IMAGE_URI_LATEST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:stg-latest"

          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.app_version }}" \
            -t "$IMAGE_URI_SHA" \
            -t "$IMAGE_URI_LATEST" \
            .
          docker push "$IMAGE_URI_SHA"
          docker push "$IMAGE_URI_LATEST"

          echo "image_uri=$IMAGE_URI_SHA" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Fetch current service task definition as base (avoid fixed revision)
      - name: Fetch base task definition from running service and sanitize
        run: |
          TD_ARN=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].taskDefinition" \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "${TD_ARN}" \
            --query taskDefinition \
            > taskdef_raw.json

          jq '{
            family: .family,
            taskRoleArn: .taskRoleArn,
            executionRoleArn: .executionRoleArn,
            networkMode: .networkMode,
            containerDefinitions: .containerDefinitions,
            volumes: (.volumes // []),
            placementConstraints: (.placementConstraints // []),
            requiresCompatibilities: .requiresCompatibilities,
            cpu: .cpu,
            memory: .memory,
            runtimePlatform: (.runtimePlatform // null),
            ephemeralStorage: (.ephemeralStorage // null),
            proxyConfiguration: (.proxyConfiguration // null),
            inferenceAccelerators: (.inferenceAccelerators // null),
            pidMode: (.pidMode // null),
            ipcMode: (.ipcMode // null)
          }
          | with_entries(select(.value != null))' taskdef_raw.json > taskdef_base.json

          echo "Sanitized task definition generated: taskdef_base.json"

      - name: Ensure SPRING_PROFILES_ACTIVE=stg and inject APP_VERSION
        run: |
          jq '(.containerDefinitions[] | select(.name=="'${{ env.CONTAINER_NAME }}'") | .environment)
              |= (map(select(.name | IN("SPRING_PROFILES_ACTIVE","APP_VERSION") | not))
                  + [
                      {"name":"SPRING_PROFILES_ACTIVE","value":"stg"},
                      {"name":"APP_VERSION","value":"${{ steps.version.outputs.app_version }}"}
                    ])' \
              taskdef_base.json > taskdef_tmp.json
          mv taskdef_tmp.json taskdef_base.json

      - name: Render new task definition (replace image)
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef_base.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image_uri }}

      - name: Deploy task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true