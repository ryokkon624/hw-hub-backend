name: deploy-backend-stg

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECS_CLUSTER: hwhub-stg
  ECS_SERVICE: hwhub-backend-stg
  TASK_FAMILY: hwhub-backend
  BASE_REVISION: "37"
  CONTAINER_NAME: hwhub-backend
  ECR_REPOSITORY: hwhub-backend
  AWS_ACCOUNT_ID: "564323392873"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::564323392873:role/gh-actions-hwhub-backend-stg
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        id: build
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:stg-${GITHUB_SHA}"
          IMAGE_URI_LATEST="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:stg-latest"

          docker build -t "$IMAGE_URI" -t "$IMAGE_URI_LATEST" .
          docker push "$IMAGE_URI"
          docker push "$IMAGE_URI_LATEST"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_uri_latest=$IMAGE_URI_LATEST" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 既存のtaskdefを取得して「register可能な形」に整形する
      - name: Fetch base task definition and sanitize
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}:${BASE_REVISION}" \
            --query taskDefinition \
            > taskdef_raw.json

          # register-task-definition が受け付ける形にサニタイズ
          jq '{
            family: .family,
            taskRoleArn: .taskRoleArn,
            executionRoleArn: .executionRoleArn,
            networkMode: .networkMode,
            containerDefinitions: .containerDefinitions,
            volumes: (.volumes // []),
            placementConstraints: (.placementConstraints // []),
            requiresCompatibilities: .requiresCompatibilities,
            cpu: .cpu,
            memory: .memory,
            runtimePlatform: (.runtimePlatform // null),
            ephemeralStorage: (.ephemeralStorage // null),
            proxyConfiguration: (.proxyConfiguration // null),
            inferenceAccelerators: (.inferenceAccelerators // null),
            pidMode: (.pidMode // null),
            ipcMode: (.ipcMode // null)
          }
          | with_entries(select(.value != null))' taskdef_raw.json > taskdef_base.json

          echo "Sanitized task definition generated: taskdef_base.json"

      - name: Override SPRING_PROFILES_ACTIVE=stg
        run: |
          jq '(.containerDefinitions[] | select(.name=="${{ env.CONTAINER_NAME }}") | .environment)
              |= (map(select(.name!="SPRING_PROFILES_ACTIVE"))
                  + [{"name":"SPRING_PROFILES_ACTIVE","value":"stg"}])' \
              taskdef_base.json > taskdef_base_tmp.json
          mv taskdef_base_tmp.json taskdef_base.json

      - name: Render new task definition (replace image)
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef_base.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image_uri }}

      - name: Deploy task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
