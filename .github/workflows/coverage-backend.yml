name: coverage-backend

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-backend
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"

jobs:
  build-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests & generate JaCoCo report
        run: |
          ./gradlew test jacocoTestReport -x spotlessCheck

      # ここがレポートの実体（JaCoCo HTML）
      - name: Verify report exists
        run: |
          ls -la build/reports/jacoco/test/html
          test -f build/reports/jacoco/test/html/index.html

      # Pages は「アーティファクト」をデプロイする方式（推奨）
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/reports/jacoco/test/html

  deploy:
    runs-on: ubuntu-latest
    needs: build-coverage
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
